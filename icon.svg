<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#000000"/>
  <!-- stopwatch, kept within central safe zone for maskable cropping -->
  <g stroke="#FFFFFF" fill="none" stroke-linecap="round">
    <!-- top button -->
    <line x1="256" y1="150" x2="256" y2="176" stroke-width="22"/>
    <line x1="232" y1="148" x2="280" y2="148" stroke-width="22"/>
    <!-- side crown -->
    <line x1="335" y1="185" x2="352" y2="168" stroke-width="18"/>
    <!-- body -->
    <circle cx="256" cy="286" r="110" stroke-width="22"/>
    <!-- hand at ~ten past -->
    <line x1="256" y1="286" x2="256" y2="216" stroke-width="18"/>
    <line x1="256" y1="286" x2="304" y2="314" stroke-width="18"/>
  </g>
  <circle cx="256" cy="286" r="12" fill="#FF3B30"/>
</svg>
